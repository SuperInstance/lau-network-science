[package]
name = "lau-network-science"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SuperInstance/lau-network-science"
description = "Network science library: models, centrality, community detection, epidemic spreading, and agent social network analysis"

[dependencies]
serde = { version = "1", features = ["derive"] }
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"
